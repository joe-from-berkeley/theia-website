<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theia — Inventory management built for jewelry dealers</title>
    <meta name="description" content="Photograph it. Price it. Sell it. All from your phone.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blush: #FDE8E0;
            --blush-deep: #F5D5C8;
            --gold: #C9A84C;
            --gold-hover: #B8963E;
            --ink: #1A1A1A;
            --ink-light: #6B6B6B;
            --white: #FFFFFF;
        }

        body {
            background-color: var(--blush);
            color: var(--ink);
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Hero */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .logo-container {
            width: 160px;
            height: 160px;
            margin-bottom: 3rem;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Placeholder for logo - remove when real logo is added */
        .logo-placeholder {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 1.5px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3rem;
            opacity: 0.15;
        }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 300;
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: -0.01em;
            line-height: 1.15;
            margin-bottom: 1.2rem;
            max-width: 560px;
        }

        .subtitle {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: var(--ink-light);
            line-height: 1.6;
            margin-bottom: 2.8rem;
            max-width: 400px;
            letter-spacing: 0.01em;
        }

        .app-store-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--gold);
            color: var(--white);
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: background-color 0.2s ease;
        }

        .app-store-btn:hover {
            background-color: var(--gold-hover);
        }

        .app-store-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--blush-deep);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--ink-light);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--ink);
        }

        .footer-note {
            font-size: 0.8rem;
            color: var(--ink-light);
            letter-spacing: 0.03em;
        }

        .footer-note span {
            display: block;
            margin-top: 0.4rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            main {
                padding: 3rem 1.5rem;
            }

            .logo-container,
            .logo-placeholder {
                width: 120px;
                height: 120px;
                margin-bottom: 2.4rem;
            }

            .footer-links {
                gap: 1.5rem;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .app-store-btn {
                transition: none;
            }
            .footer-links a {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <main>
        <!-- Replace this placeholder with your logo:
             <div class="logo-container"><img src="logo.png" alt="Theia"></div>
        -->
        <div class="logo-placeholder"></div>

        <h1>Inventory management built for jewelry dealers</h1>

        <p class="subtitle">Photograph it. Price it. Sell it.<br>All from your phone.</p>

        <a href="#" class="app-store-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.71 19.5C17.88 20.74 17 21.95 15.66 21.97C14.32 21.99 13.89 21.18 12.37 21.18C10.84 21.18 10.37 21.95 9.1 21.99C7.79 22.03 6.8 20.68 5.96 19.47C4.25 16.97 2.94 12.45 4.7 9.39C5.57 7.87 7.13 6.91 8.82 6.88C10.1 6.86 11.32 7.75 12.11 7.75C12.89 7.75 14.37 6.68 15.92 6.84C16.57 6.87 18.39 7.1 19.56 8.82C19.47 8.88 17.39 10.1 17.41 12.63C17.44 15.65 20.06 16.66 20.09 16.67C20.06 16.74 19.67 18.11 18.71 19.5ZM13 3.5C13.73 2.67 14.94 2.04 15.94 2C16.07 3.17 15.6 4.35 14.9 5.19C14.21 6.04 13.07 6.7 11.95 6.61C11.8 5.46 12.36 4.26 13 3.5Z"/>
            </svg>
            Find us on the App Store
        </a>
    </main>

    <footer>
        <nav class="footer-links">
            <a href="mailto:hello@theia.app">Contact Us</a>
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Service</a>
        </nav>
        <p class="footer-note">
            Built in London for the trade.
            <span>&copy; 2026 Theia</span>
        </p>
    </footer>

</body>
</html>
